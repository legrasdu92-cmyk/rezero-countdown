<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0912">
<meta name="description" content="Re:ZERO — compte à rebours des prochains épisodes">
<link rel="manifest" href="manifest.json">
<title>Re:ZERO Countdown</title>
<style>
:root{--bg:#09080e;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--text:#fff;--muted:#aaa5b8;--accent:#9b86ff;--accent2:#7058d8}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#3a2e59 0,#171321 35%,var(--bg) 75%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 80%,rgba(112,91,190,.14),transparent 32%),radial-gradient(circle at 85% 25%,rgba(140,90,190,.12),transparent 35%)}.app{width:min(920px,100%);position:relative}.top{text-align:center}.brand{font-size:12px;font-weight:800;letter-spacing:5px;color:#c4b8ff}.season{display:inline-block;margin:12px 0 12px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.045);font-size:11px;color:var(--muted);letter-spacing:1px}.title{margin:0;font-size:clamp(40px,8vw,78px);line-height:.95;letter-spacing:-3px}.subtitle{margin:16px 0 28px;color:var(--muted);font-size:15px}.hero{padding:22px;border:1px solid var(--line);border-radius:28px;background:rgba(8,7,13,.48);box-shadow:0 24px 80px rgba(0,0,0,.3);backdrop-filter:blur(18px)}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.unit{padding:24px 8px;border-radius:20px;background:var(--card);border:1px solid var(--line)}.number{font-size:clamp(36px,8vw,70px);font-weight:850;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-2px}.label{margin-top:9px;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8e899d}.release{margin-top:20px;color:#d2cedc;font-size:14px}.tz{margin-top:6px;color:#777181;font-size:12px}.bar{height:5px;margin-top:18px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.08)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width 1s linear}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:transparent}.section{margin-top:22px}.section h2{font-size:15px;margin:0 0 10px;color:#d9d4e4}.episodes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.ep{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.035)}.ep strong{font-size:13px}.ep small{color:#858091;font-size:11px}.ep.next{border-color:rgba(155,134,255,.45);background:rgba(120,95,210,.09)}.badge{font-size:10px;font-weight:800;padding:5px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:#aaa4b7}.badge.next{background:rgba(155,134,255,.18);color:#cfc5ff}.badge.done{color:#8d8a96}.footer{text-align:center;color:#625e6c;font-size:11px;margin-top:20px}@media(max-width:600px){body{padding:14px}.hero{padding:14px;border-radius:22px}.timer{grid-template-columns:repeat(2,1fr)}.unit{padding:21px 6px}.episodes{grid-template-columns:1fr}.title{letter-spacing:-2px}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="brand">RE:ZERO</div><div class="season">SAISON 4 · COUNTDOWN</div><h1 class="title" id="title">Épisode —</h1><p class="subtitle">Le prochain épisode arrive dans</p></div>
<section class="hero">
<div class="timer"><div class="unit"><div class="number" id="d">00</div><div class="label">Jours</div></div><div class="unit"><div class="number" id="h">00</div><div class="label">Heures</div></div><div class="unit"><div class="number" id="m">00</div><div class="label">Minutes</div></div><div class="unit"><div class="number" id="s">00</div><div class="label">Secondes</div></div></div>
<div class="release" id="release">Chargement…</div><div class="tz" id="tz">Détection du fuseau horaire…</div><div class="bar"><i id="progress"></i></div>
<div class="actions"><button class="btn primary" id="install" hidden>📱 Installer l'application</button><button class="btn" id="notify">🔔 Notifications</button></div>
</section>
<section class="section"><h2>Calendrier</h2><div class="episodes" id="episodes"></div></section>
<div class="footer">Le compteur utilise l'heure exacte de votre appareil et convertit automatiquement les dates dans votre fuseau.</div>
</main>
<script>
const episodes=[
{n:12,date:'2026-08-12T14:00:00Z'},{n:13,date:'2026-08-19T14:00:00Z'},{n:14,date:'2026-08-26T14:00:00Z'},{n:15,date:'2026-09-02T14:00:00Z'},{n:16,date:'2026-09-09T14:00:00Z'},{n:17,date:'2026-09-16T14:00:00Z'},{n:18,date:'2026-09-23T14:00:00Z'},{n:19,date:'2026-09-30T14:00:00Z'}];
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
const fmt=new Intl.DateTimeFormat(navigator.language||'fr-FR',{dateStyle:'full',timeStyle:'short'});
const tzName=Intl.DateTimeFormat().resolvedOptions().timeZone||'Fuseau local';
$('tz').textContent='🌍 '+tzName;
function current(){const now=Date.now();return episodes.find(e=>Date.parse(e.date)>now)}
function renderList(active){$('episodes').innerHTML=episodes.map((e,i)=>{const t=Date.parse(e.date),done=t<=Date.now(),next=active&&e.n===active.n;return `<div class="ep ${next?'next':''}"><div><strong>Épisode ${e.n}</strong><br><small>${fmt.format(new Date(e.date))}</small></div><span class="badge ${done?'done':next?'next':''}">${done?'✓ Sorti':next?'⏳ Prochain':'À venir'}</span></div>`}).join('')}
let lastEpisode=null;
function update(){const now=Date.now(),ep=current();if(!ep){$('title').textContent='Saison terminée';$('release').textContent='Tous les épisodes programmés sont sortis.';['d','h','m','s'].forEach(id=>$(id).textContent='00');$('progress').style.width='100%';renderList(null);return}const target=Date.parse(ep.date),diff=Math.max(0,target-now),sec=Math.floor(diff/1000);$('title').textContent='Épisode '+ep.n;$('d').textContent=pad(Math.floor(sec/86400));$('h').textContent=pad(Math.floor(sec%86400/3600));$('m').textContent=pad(Math.floor(sec%3600/60));$('s').textContent=pad(sec%60);$('release').textContent='Sortie : '+fmt.format(new Date(ep.date));const idx=episodes.indexOf(ep),start=idx>0?Date.parse(episodes[idx-1].date):now;const pct=idx>0?Math.max(0,Math.min(100,(now-start)/(target-start)*100)):0;$('progress').style.width=pct+'%';if(lastEpisode!==ep.n){renderList(ep);lastEpisode=ep.n}}
update();setInterval(update,1000);
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').hidden=false});$('install').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('install').hidden=true};
$('notify').onclick=async()=>{if(!('Notification'in window)){alert('Les notifications ne sont pas disponibles dans ce navigateur.');return}const p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'🔔 Notifications activées':'🔕 Notifications refusées'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
